name: Deploy to EC2 (Docker)

on:
  workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build JAR
        run: mvn clean package

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: docker build -t dhanvijayvsl/journey-app:latest .

      - name: Push Docker Image
        run: docker push dhanvijayvsl/journey-app:latest

      - name: Deploy to EC2-1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_1 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo docker stop journey-app || true
            sudo docker rm journey-app || true
            sudo docker pull dhanvijayvsl/journey-app:latest
            sudo docker run -d -p 80:8080 --name journey-app dhanvijayvsl/journey-app:latest

      - name: Deploy to EC2-2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_2 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo docker stop journey-app || true
            sudo docker rm journey-app || true
            sudo docker pull dhanvijayvsl/journey-app:latest
            sudo docker run -d -p 80:8080 --name journey-app dhanvijayvsl/journey-app:latest