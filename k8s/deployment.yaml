apiVersion: apps/v1
kind: Deployment
metadata:
  name: journey-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: journey-app
  template:
    metadata:
      labels:
        app: journey-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: journey-app
          image: dhanvijayvsl/journey-app:latest
          ports:
            - containerPort: 8080